[project]
name = "crypto-signal-terminal"
version = "0.1.0"
description = "Desktop Windows terminal for crypto futures strategy analysis and signals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "pandas>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
exchange = ["ccxt>=4.3"]
charts = ["pyqtgraph>=0.13"]

[project.scripts]
crypto-signal-terminal = "crypto_signal_terminal.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
